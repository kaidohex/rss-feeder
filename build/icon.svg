<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Marginalia: a reading desk tile with a folded newspaper mark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252f"/>
      <stop offset="1" stop-color="#17181f"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e07a5f"/>
      <stop offset="1" stop-color="#c9563f"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- Newspaper sheet, slightly rotated fold at the right edge -->
  <rect x="212" y="272" width="600" height="480" rx="28" fill="#f5f3ee"/>
  <!-- Fold shadow along the spine -->
  <rect x="212" y="272" width="600" height="480" rx="28" fill="none" stroke="#e4e0d6" stroke-width="6"/>

  <!-- Masthead rule -->
  <rect x="268" y="330" width="488" height="10" rx="5" fill="#17181f" opacity="0.85"/>

  <!-- Headline block: coral photo block left, headline lines right -->
  <rect x="268" y="384" width="212" height="150" rx="16" fill="url(#coral)"/>
  <rect x="512" y="396" width="244" height="22" rx="11" fill="#2a2c36"/>
  <rect x="512" y="442" width="244" height="14" rx="7" fill="#8b8e99"/>
  <rect x="512" y="470" width="244" height="14" rx="7" fill="#8b8e99"/>
  <rect x="512" y="498" width="176" height="14" rx="7" fill="#8b8e99"/>

  <!-- Body columns -->
  <rect x="268" y="574" width="488" height="12" rx="6" fill="#b9bcc4"/>
  <rect x="268" y="610" width="488" height="12" rx="6" fill="#b9bcc4"/>
  <rect x="268" y="646" width="340" height="12" rx="6" fill="#b9bcc4"/>

  <!-- Coral bookmark ribbon sliding out of the fold -->
  <path d="M742 272 h70 a28 28 0 0 1 28 28 v118 l-49 -38 -49 38 z" fill="url(#coral)"/>
</svg>
