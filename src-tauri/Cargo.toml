[package]
name = "marginalia"
version = "0.1.0"
description = "A calm, personal reading desk for stories from the feeds you follow."
authors = ["kaidohex <154259109+kaidohex@users.noreply.github.com>"]
license = "GPL-3.0"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = "2"
tauri-build = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
window-vibrancy = "0.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
