name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the SPA, then packages an unpacked portable folder in release/win-unpacked.
      - run: npm run desktop:build

      - name: Zip the portable folder
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath "Marginalia-${{ github.ref_name }}-windows-x64.zip"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Marginalia ${{ github.ref_name }}"
          body: "Portable Windows build. Unzip and run Marginalia.exe — no installation needed."
          files: Marginalia-*-windows-x64.zip
