name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  publish-windows:
    name: Build Windows portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") { throw "Tag $tag does not match package.json version $version" }

      # Builds the SPA, then packages an unpacked portable folder in release/win-unpacked.
      - run: npm run desktop:build

      - name: Check the packaged app
        shell: pwsh
        run: |
          $exe = "release/win-unpacked/Marginalia.exe"
          if (-not (Test-Path $exe)) { throw "Packaging did not produce $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB)
          if ($size -lt 50) { throw "Marginalia.exe looks truncated ($size MB)" }
          Write-Host "Marginalia.exe built ($size MB)"

      - name: Zip the portable folder
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked/* -DestinationPath "Marginalia-${{ github.ref_name }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: Marginalia-*-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run desktop:build:linux

      - name: Check the packaged app
        run: |
          appimage=$(ls release/*.AppImage)
          test -n "$appimage" || { echo "Packaging did not produce an AppImage"; exit 1; }
          test "$(stat -c%s "$appimage")" -gt 104857600 || { echo "AppImage looks truncated: $appimage"; exit 1; }
          echo "Built $appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    needs: [publish-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist

      - name: Write checksums
        run: |
          cd dist
          for f in Marginalia-*; do
            sha256sum "$f" >> SHA256SUMS.txt
          done
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: "Marginalia ${{ github.ref_name }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### Portable builds — nothing to install

            **Windows**
            1. Download the zip below and unzip it anywhere.
            2. Run `Marginalia.exe` — no admin rights needed.
            3. Feeds and settings live in `%APPDATA%\Marginalia`.

            **Linux**
            1. Download the AppImage below.
            2. `chmod +x Marginalia-*-linux-x64.AppImage && ./Marginalia-*-linux-x64.AppImage`
            3. Feeds and settings live in `~/.config/Marginalia`.

            ### Good to know

            - The builds are unsigned, so Windows SmartScreen may ask for confirmation on first launch (**More info → Run anyway**). On Linux the AppImage may warn when it was not downloaded through a package manager.
            - Moving feeds between the browser and desktop builds: use **Manage feeds → Export** in one and **Import** in the other.
            - Check any download with `SHA256SUMS.txt`.
          files: |
            dist/Marginalia-*-windows-x64.zip
            dist/Marginalia-*-linux-x64.AppImage
            dist/SHA256SUMS.txt
